services:
  web:
    image: nextjs-week10-app:local

    container_name: nextjs-week10-container

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3